[project]
name = "meetnotes"
version = "0.1.0"
description = "Local-first meeting transcription (Granola-style) — Phase 1 vertical slice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "sounddevice>=0.5",
    "keyring>=25.0",
    "anthropic>=0.117.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "sqlite-vec>=0.1.9",
    "sentence-transformers>=5.6.0",
]

[project.scripts]
meetnotes = "meetnotes.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetnotes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/meetnotes"]

[[tool.mypy.overrides]]
module = ["sounddevice", "sentence_transformers", "docx", "sqlite_vec"]
ignore_missing_imports = true
